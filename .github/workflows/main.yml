name: EEX Scraper Scheduled

on:
  schedule:
    # 08h00, 08h30 et 09h00 heure France (été)
    - cron: '0,30 6-7 * * 1-5'

  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    env:
      GitHub__Token: ${{ secrets.EEX_WEBSCRAPING }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Run scraper
        run: dotnet run --project WebScrapingHub/WebScrapingHub.csproj --configuration Release
